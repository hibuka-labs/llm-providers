[workspace]
members = ["llm-trait", "fuzz"]
resolver = "2"

[package]
name = "llm-unified"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"  # driven by reqwest 0.13 -> icu 2.3
description = "Unified LLM provider layer: one trait, many backends (OpenAI, Anthropic, DeepSeek, Qwen, ...)"
license = "MIT"
repository = "https://github.com/hibuka-labs/llm-providers"
readme = "README.md"
keywords = ["llm", "openai", "anthropic", "ai", "provider"]
categories = ["api-bindings", "asynchronous"]

[features]
fuzzing = []

[dependencies]
llm-trait = { path = "llm-trait", version = "0.1.3" }
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
eventsource-stream = "0.2"
futures-core = "0.3"
futures-util = "0.3"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52", features = ["full"] }
tracing = "0.1"
rand = "0.10"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1.52", features = ["full", "test-util"] }
proptest = "1"

[[bin]]
name = "llm-cli"
path = "src/bin/llm-cli.rs"

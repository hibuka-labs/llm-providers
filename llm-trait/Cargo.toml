[package]
name = "llm-trait"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"  # driven by reqwest 0.13 -> icu 2.3
description = "Trait definitions and core types for a unified LLM provider layer"
license = "MIT"
repository = "https://github.com/hibuka-labs/llm-providers"
readme = "../README.md"
keywords = ["llm", "openai", "anthropic", "traits", "ai"]
categories = ["api-bindings", "asynchronous"]

[dependencies]
async-trait = "0.1"
bytes = "1"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-core = "0.3"
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
proptest = "1"

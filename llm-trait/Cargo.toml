[package]
name = "llm-trait"
version = "0.1.0"
edition = "2024"
description = "Trait definitions and core types for LLM providers"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-core = "0.3"
futures-util = "0.3"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

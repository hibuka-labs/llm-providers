[package]
name = "llm-unified-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.llm-unified]
path = ".."
features = ["fuzzing"]

[dependencies.llm-trait]
path = "../llm-trait"

[[bin]]
name = "domain_matches_fuzz"
path = "fuzz_targets/domain_matches_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_openai_response_fuzz"
path = "fuzz_targets/parse_openai_response_fuzz.rs"
test = false
doc = false
bench = false

[[bin]]
name = "parse_anthropic_response_fuzz"
path = "fuzz_targets/parse_anthropic_response_fuzz.rs"
test = false
doc = false
bench = false
